services:
  db:
    image: postgres:15
    container_name: healthcare-data-pipeline-db-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-data-pipeline-api-1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/healthdb
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-data-pipeline-etl-1
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/healthdb
    command: python -m etl.run_pipeline

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: healthcare-data-pipeline-dashboard-1
    ports:
      - "8501:8501"
    depends_on:
      - api    
